name: gnade_app
description: An application for  Sales &amp; Invoicing · Inventory · Expenses · Reports · Team Management · Receipt Printing · Push Notifications
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # Navigation
  go_router: ^18.1.3

  # Networking
  internet_connection_checker_plus: ^3.1.0
  dio: ^5.9.2

  # State Management
  fpdart: ^1.2.0
  equatable: ^3.0.0
  flutter_riverpod: ^3.2.1

  # Backend – Firebase
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.0.1

  # Backend – Supabase
  supabase_flutter: ^2.12.0

  # Backend – Appwrite

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^11.2.0

  # Images & SVG
  cached_network_image: ^4.0.6
  flutter_svg: ^2.2.4

  # Icons
  hugeicons: ^4.4.0

  # Shimmer / Skeleton
  skeletonizer: ^3.0.0

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Animations
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^3.0.0

  # Environment
  flutter_dotenv: ^6.0.0

  # Logging
  logger: ^2.6.2

  # Media
  image_picker: ^1.2.1
  file_picker: ^13.3.2

  # Utilities
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  share_plus: ^13.2.0
  pdf: ^3.10.8
  printing: ^5.15.0
  permission_handler: ^13.0.2
  flutter_contacts: ^2.2.2

  # Device & System
  device_info_plus: ^13.2.0
  app_version_update: ^7.0.0

  # Localization
  easy_localization: ^3.0.8
  intl: ^0.20.2

  flutter_native_splash: ^2.4.7

  flutter_thermal_printer: ^2.2.1
  esc_pos_utils_plus: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo/app_logo.png"
  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo/app_logo.png"

dependency_overrides:
  # Riverpod 3.x requires a newer test_api than what Flutter SDK pins.
  # This override allows resolution while remaining compatible with flutter_test.
  # test_api: 0.7.6

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/logo/
    - assets/icons/
    - assets/translations/
    - assets/fonts/
    - .env

  fonts:
    - family: Inter VariableFont Opsz,Wght
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
